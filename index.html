<!DOCTYPE html>
<html>

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">

    <meta charset=utf-8>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Three.js Space Explorer</title>
    
    <!-- PWA Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-title" content="Space Explorer">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body class="relative">
    <canvas class="webgl"></canvas>
    <canvas class="stars-canvas"></canvas>

    <div class="corner-text top-left" id="coords"></div>
    <div class="corner-text bottom-left">
        <div class="mobile-controls">
            <div class="arrow-row">
                <button class="arrow-btn" id="arrow-up">↑</button>
            </div>
            <div class="arrow-row">
                <button class="arrow-btn" id="arrow-left">←</button>
                <button class="arrow-btn" id="arrow-down">↓</button>
                <button class="arrow-btn" id="arrow-right">→</button>
            </div>
        </div>
    </div>
    <div class="corner-text bottom-right cursor-default no-select">
        <button>boost</button>
    </div>
    <!-- <i data-lucide="home" class="icon-home"></i> -->

    <!-- CDN Link to Three.js -->
    <script type="module" src="./index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.js"></script>
    <script>
        lucide.createIcons();
        
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('SW registered: ', registration);
                    })
                    .catch((registrationError) => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
        </script>
</body>

</html>
